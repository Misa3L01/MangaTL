[project]
name = "mangatl"
version = "0.1.0"
description = "Traductor automático de manga (JA/EN → ES), 100 % local y gratuito"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Misa3L01" }]
keywords = ["manga", "translation", "ocr", "llm", "ollama", "inpainting", "typesetting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Spanish",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14",
    "torchvision>=0.29",
    "transformers>=5.0",
    "huggingface-hub>=1.0",
    "manga-ocr>=0.1.16",
    "pillow>=11.0",
    "numpy>=2.0",
    "pymupdf>=1.26",
    "typer>=0.16",
    "rich>=14.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "httpx>=0.28",
    "ollama>=0.6",
    "pyphen>=0.17",
    "fonttools>=4.59",
    "rapidocr>=3.9.2",
    "onnxruntime>=1.30.0",
    "opencv-python>=4.12",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/Misa3L01/MangaTL"
Issues = "https://github.com/Misa3L01/MangaTL/issues"

[project.scripts]
mangatl = "mangatl.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Never let uv download a Python on its own (it would go to %APPDATA% on C: if env.ps1 is not loaded).
python-downloads = "manual"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA and downloaded model weights",
    "ollama: requires a running Ollama server",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Japanese/Spanish punctuation in strings is intentional

[tool.ruff.lint.per-file-ignores]
"tests/test_ollama_runtime.py" = ["E501"]  # verbatim Ollama server log lines
