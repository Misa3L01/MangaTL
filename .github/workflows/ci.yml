name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint y tests (sin GPU)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Python 3.12
        run: uv python install 3.12

      # PyTorch (CUDA, ~2.5 GB) is skipped: every torch import is lazy and the GPU tests are
      # deselected, so the rest of the suite runs on a plain runner.
      - name: Dependencias (sin PyTorch)
        run: uv sync --locked --no-install-package torch --no-install-package torchvision

      - name: Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Tests
        run: uv run --no-sync pytest -m "not gpu and not ollama"

  web:
    name: Editor web (TypeScript + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
